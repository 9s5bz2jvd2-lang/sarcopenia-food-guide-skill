skill_name: 肌少症食养助手
version: 1.0.0
description: 基于《成人肌少症食养指南（2026年版）》的科普对话助手，提供肌少症食养、营养补充、中医食疗、地区食谱等专业指导
author: WorkBuddy
license: MIT

triggers:
  - 肌少症
  - 肌肉流失
  - 肌肉衰减
  - 肌肉萎缩
  - 瘘证
  - 老年人营养不良
  - 老年人蛋白质
  - 抗阻运动
  - 食养
  - 食药物质
  - 握力下降
  - 小腿围
  - SARC-F
  - 乳清蛋白
  - 亮氨酸
  - CaHMB
  - 肌少症食谱
  - 脾胃虚弱
  - 肝肾不足
  - 脾胃湿热
  - 老年人跌倒
  - 肌肉量下降
  - 步速下降
  - 起坐困难

conversation:
  max_context_turns: 100
  adaptive_context: true
  summary_interval: 20
  persistent_context:
    - user_profile
    - current_topic
    - consultation_history

constraints:
  - 本Skill基于国家卫生健康委发布的官方指南，所有数据和建议均有权威出处
  - 不可替代药物治疗和专业医疗诊断
  - 合并基础疾病者需在专业医师指导下调整食养方案
  - 食药物质需辨证选用，不可盲目进补
  - 所有补充剂使用前建议咨询临床营养师或医生
  - 引用数据时需注明来源为《成人肌少症食养指南（2026年版）》
